<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Portal</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const API_BASE = "/api/admin/record";

      // API service using your actual endpoints
      const api = {
        get: async (endpoint) => {
          const response = await fetch(`${API_BASE}${endpoint}`);
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.json();
        },
        post: async (endpoint, data) => {
          const response = await fetch(`${API_BASE}${endpoint}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.json();
        },
        put: async (endpoint, data) => {
          const response = await fetch(`${API_BASE}${endpoint}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.json();
        },
        delete: async (endpoint) => {
          const response = await fetch(`${API_BASE}${endpoint}`, {
            method: "DELETE",
          });
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.json();
        },
      };

      // File upload service
      const uploadFile = async (file) => {
        // Simulate file upload
        return new Promise((resolve) => {
          setTimeout(() => {
            resolve(`uploads/${file.name}`);
          }, 1000);
        });
      };

      // Dashboard component
      const Dashboard = () => {
        const [stats, setStats] = useState(null);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
          const fetchStats = async () => {
            try {
              // const data = await api.get("/stats/dashboard");
              const response = await fetch(`/api/admin/stats/dashboard`, {
                method: "GET",
                headers: { "Content-Type": "application/json" },
                // body: JSON.stringify(data),
              });
              const data = await response.json();
              console.log(data);
              setStats(data);
            } catch (error) {
              console.error("Error fetching stats:", error);
            } finally {
              setLoading(false);
            }
          };
          fetchStats();
        }, []);

        if (loading) {
          return (
            <div className="flex justify-center items-center h-64">
              <div className="text-center">
                <i className="fas fa-spinner fa-spin text-3xl text-blue-500 mb-4"></i>
                <p className="text-gray-600">Loading dashboard...</p>
              </div>
            </div>
          );
        }

        if (!stats) {
          return (
            <div className="flex justify-center items-center h-64">
              <div className="text-center">
                <i className="fas fa-exclamation-circle text-3xl text-red-500 mb-4"></i>
                <p className="text-gray-600">Failed to load dashboard data</p>
                <button
                  onClick={() => window.location.reload()}
                  className="mt-4 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600"
                >
                  Retry
                </button>
              </div>
            </div>
          );
        }

        return (
          <div className="p-6">
            <div className="mb-8">
              <h1 className="text-3xl font-bold text-gray-900 mb-2">
                Dashboard Overview
              </h1>
              <p className="text-gray-600">
                Monitor your platform's key metrics and recent activities
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
              <div className="bg-gradient-to-r from-blue-500 to-blue-600 text-white p-6 rounded-xl shadow-lg">
                <div className="flex items-center">
                  <div className="p-3 bg-white bg-opacity-20 rounded-lg mr-4">
                    <i className="fas fa-users text-2xl"></i>
                  </div>
                  <div>
                    <h3 className="text-sm font-medium opacity-90">
                      Total Customers
                    </h3>
                    <p className="text-3xl font-bold">
                      {stats.stats.customers}
                    </p>
                  </div>
                </div>
              </div>

              <div className="bg-gradient-to-r from-green-500 to-green-600 text-white p-6 rounded-xl shadow-lg">
                <div className="flex items-center">
                  <div className="p-3 bg-white bg-opacity-20 rounded-lg mr-4">
                    <i className="fas fa-store text-2xl"></i>
                  </div>
                  <div>
                    <h3 className="text-sm font-medium opacity-90">
                      Active Vendors
                    </h3>
                    <p className="text-3xl font-bold">{stats.stats.vendors}</p>
                  </div>
                </div>
              </div>

              <div className="bg-gradient-to-r from-yellow-500 to-yellow-600 text-white p-6 rounded-xl shadow-lg">
                <div className="flex items-center">
                  <div className="p-3 bg-white bg-opacity-20 rounded-lg mr-4">
                    <i className="fas fa-cogs text-2xl"></i>
                  </div>
                  <div>
                    <h3 className="text-sm font-medium opacity-90">
                      Equipment Listed
                    </h3>
                    <p className="text-3xl font-bold">
                      {stats.stats.equipment}
                    </p>
                  </div>
                </div>
              </div>

              <div className="bg-gradient-to-r from-purple-500 to-purple-600 text-white p-6 rounded-xl shadow-lg">
                <div className="flex items-center">
                  <div className="p-3 bg-white bg-opacity-20 rounded-lg mr-4">
                    <i className="fas fa-briefcase text-2xl"></i>
                  </div>
                  <div>
                    <h3 className="text-sm font-medium opacity-90">
                      Total Jobs
                    </h3>
                    <p className="text-3xl font-bold">{stats.stats.jobs}</p>
                  </div>
                </div>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
              <div className="bg-white p-6 rounded-xl shadow-lg">
                <h2 className="text-xl font-bold text-gray-900 mb-6">
                  Recent Jobs
                </h2>
                <div className="space-y-4">
                  {stats.recentJobs.map((job) => (
                    <div
                      key={job.id}
                      className="flex justify-between items-center p-4 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors"
                    >
                      <div className="flex items-center">
                        <div className="p-2 bg-blue-100 rounded-lg mr-4">
                          <i className="fas fa-hammer text-blue-600"></i>
                        </div>
                        <div>
                          <p className="font-semibold text-gray-900">
                            {job.jobType}
                          </p>
                          <p className="text-sm text-gray-600">
                            {job.customer?.fullName}
                          </p>
                          <p className="text-xs text-gray-500">
                            {new Date(job.createdAt).toLocaleDateString()}
                          </p>
                        </div>
                      </div>
                      <span
                        className={`px-3 py-1 rounded-full text-xs font-medium ${
                          job.status === "ACTIVE"
                            ? "bg-green-100 text-green-800"
                            : job.status === "PENDING"
                            ? "bg-yellow-100 text-yellow-800"
                            : "bg-gray-100 text-gray-800"
                        }`}
                      >
                        {job.status}
                      </span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="bg-white p-6 rounded-xl shadow-lg">
                <h2 className="text-xl font-bold text-gray-900 mb-6">
                  Recent Customers
                </h2>
                <div className="space-y-4">
                  {stats.recentCustomers.map((customer) => (
                    <div
                      key={customer.id}
                      className="flex items-center p-4 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors"
                    >
                      <div className="w-12 h-12 bg-gradient-to-r from-blue-500 to-blue-600 rounded-full flex items-center justify-center text-white font-bold text-lg mr-4">
                        {customer.fullName?.charAt(0) || "U"}
                      </div>
                      <div className="flex-1">
                        <p className="font-semibold text-gray-900">
                          {customer.fullName}
                        </p>
                        <p className="text-sm text-gray-600">
                          {customer.email}
                        </p>
                        <p className="text-sm text-gray-500">
                          {customer.phone}
                        </p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      };

      // Generic form component
      const ModelForm = ({ model, record, onSave, onCancel }) => {
        const [formData, setFormData] = useState(record || {});
        const [uploading, setUploading] = useState({});
        const [errors, setErrors] = useState({});

        const handleInputChange = (field, value) => {
          setFormData((prev) => ({ ...prev, [field]: value }));
          if (errors[field]) {
            setErrors((prev) => ({ ...prev, [field]: null }));
          }
        };

        const handleFileUpload = async (field, file) => {
          if (!file) return;

          setUploading((prev) => ({ ...prev, [field]: true }));
          try {
            const key = await uploadFile(file);
            handleInputChange(field, key);
          } catch (error) {
            alert("File upload failed: " + error.message);
          } finally {
            setUploading((prev) => ({ ...prev, [field]: false }));
          }
        };

        const validateForm = () => {
          const newErrors = {};
          const requiredFields = getRequiredFields(model);

          requiredFields.forEach((field) => {
            if (!formData[field] || formData[field] === "") {
              newErrors[field] = "This field is required";
            }
          });

          setErrors(newErrors);
          return Object.keys(newErrors).length === 0;
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          if (validateForm()) {
            onSave(formData);
          }
        };

        const getRequiredFields = (model) => {
          const required = {
            customer: ["fullName", "email", "phone"],
            vendor: [
              "companyName",
              "email",
              "coordinatorName",
              "coordinatorNumber",
              "GST",
              "PAN",
            ],
            equipment: [
              "machineName",
              "machineType",
              "machineModel",
              "dailyPrice",
              "vendorId",
            ],
            job: ["jobType", "customerId", "deliveryDate"],
          };
          return required[model] || [];
        };

        const renderField = (field) => {
          const isFileField = field.includes("File") || field.includes("Image");
          const isDateField = field.includes("Date");
          const isBooleanField = field === "isRtoRegistered";
          const isSelectField = [
            "status",
            "ownershipType",
            "fuelType",
            "machineType",
            "terrainType",
          ].includes(field);
          const isPasswordField = field === "password";

          if (isFileField) {
            return (
              <div key={field} className="mb-6">
                <label className="block text-sm font-semibold text-gray-700 mb-2 capitalize">
                  {field
                    .replace(/([A-Z])/g, " $1")
                    .replace("File", "")
                    .trim()}
                </label>
                <div className="flex items-center space-x-3">
                  <input
                    type="file"
                    onChange={(e) => handleFileUpload(field, e.target.files[0])}
                    className="flex-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    accept={
                      field.includes("Image") ? "image/*" : "image/*,.pdf"
                    }
                  />
                  {uploading[field] && (
                    <div className="flex items-center text-blue-600">
                      <i className="fas fa-spinner fa-spin mr-2"></i>
                      <span className="text-sm">Uploading...</span>
                    </div>
                  )}
                  {formData[field] && !uploading[field] && (
                    <div className="flex items-center text-green-600">
                      <i className="fas fa-check mr-2"></i>
                      <span className="text-sm">Uploaded</span>
                    </div>
                  )}
                </div>
                {formData[field] && (
                  <div className="mt-2">
                    <a
                      href={formData[field]}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="text-sm text-blue-600 hover:text-blue-800"
                    >
                      View file: {formData[field].split("/").pop()}
                    </a>
                  </div>
                )}
              </div>
            );
          }

          if (isBooleanField) {
            return (
              <div key={field} className="mb-6">
                <label className="flex items-center cursor-pointer">
                  <input
                    type="checkbox"
                    checked={formData[field] || false}
                    onChange={(e) => handleInputChange(field, e.target.checked)}
                    className="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                  />
                  <span className="ml-3 text-sm font-semibold text-gray-700">
                    {field.replace(/([A-Z])/g, " $1").trim()}
                  </span>
                </label>
              </div>
            );
          }

          if (isSelectField) {
            let options = [];
            if (field === "status") {
              options =
                model === "job"
                  ? [
                      "PENDING",
                      "ACTIVE",
                      "IN_PROGRESS",
                      "APPROVED",
                      "COMPLETED",
                      "CANCELLED",
                    ]
                  : ["ACTIVE", "INACTIVE"];
            } else if (field === "ownershipType") {
              options = ["OWNED", "LEASED", "RENTED"];
            } else if (field === "fuelType") {
              options = ["DIESEL", "PETROL", "ELECTRIC", "HYBRID"];
            } else if (field === "machineType") {
              options = [
                "Excavator",
                "Bulldozer",
                "Crane",
                "Loader",
                "Dumper",
                "Roller",
              ];
            } else if (field === "terrainType") {
              options = ["Plain", "Hilly", "Rocky", "Muddy", "Mixed"];
            }

            return (
              <div key={field} className="mb-6">
                <label className="block text-sm font-semibold text-gray-700 mb-2 capitalize">
                  {field.replace(/([A-Z])/g, " $1").trim()}
                </label>
                <select
                  value={formData[field] || ""}
                  onChange={(e) => handleInputChange(field, e.target.value)}
                  className={`w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent ${
                    errors[field] ? "border-red-500" : "border-gray-300"
                  }`}
                >
                  <option value="">
                    Select {field.replace(/([A-Z])/g, " $1").trim()}
                  </option>
                  {options.map((option) => (
                    <option key={option} value={option}>
                      {option.replace(/_/g, " ")}
                    </option>
                  ))}
                </select>
                {errors[field] && (
                  <p className="mt-1 text-sm text-red-600">{errors[field]}</p>
                )}
              </div>
            );
          }

          const inputType = isDateField
            ? "datetime-local"
            : field.includes("Price") || field.includes("rating")
            ? "number"
            : field.includes("email")
            ? "email"
            : field.includes("phone") || field.includes("Number")
            ? "tel"
            : isPasswordField
            ? "password"
            : "text";

          return (
            <div key={field} className="mb-6">
              <label className="block text-sm font-semibold text-gray-700 mb-2 capitalize">
                {field.replace(/([A-Z])/g, " $1").trim()}
              </label>
              {["additionalDetails", "comment"].includes(field) ? (
                <textarea
                  value={formData[field] || ""}
                  onChange={(e) => handleInputChange(field, e.target.value)}
                  className={`w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent ${
                    errors[field] ? "border-red-500" : "border-gray-300"
                  }`}
                  rows="4"
                  placeholder={`Enter ${field
                    .replace(/([A-Z])/g, " $1")
                    .trim()
                    .toLowerCase()}`}
                />
              ) : (
                <input
                  type={inputType}
                  value={formData[field] || ""}
                  onChange={(e) => handleInputChange(field, e.target.value)}
                  className={`w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent ${
                    errors[field] ? "border-red-500" : "border-gray-300"
                  }`}
                  step={inputType === "number" ? "0.01" : undefined}
                  placeholder={`Enter ${field
                    .replace(/([A-Z])/g, " $1")
                    .trim()
                    .toLowerCase()}`}
                />
              )}
              {errors[field] && (
                <p className="mt-1 text-sm text-red-600">{errors[field]}</p>
              )}
            </div>
          );
        };

        const getFieldsForModel = (model) => {
          const modelFields = {
            customer: ["fullName", "email", "phone", "password"],
            vendor: [
              "companyName",
              "GST",
              "PAN",
              "email",
              "coordinatorName",
              "coordinatorNumber",
              "documentType",
              "documentNumber",
              "documentFile",
              "password",
            ],
            equipment: [
              "machineType",
              "machineName",
              "machineModel",
              "ownershipType",
              "address",
              "nameOfManufacturer",
              "invoiceNumber",
              "invoiceDate",
              "isRtoRegistered",
              "registrationNumber",
              "registeredState",
              "insuranceValidity",
              "purchaseYear",
              "fuelType",
              "dailyPrice",
              "weeklyPrice",
              "monthlyPrice",
              "status",
              "vendorId",
              "rcFile",
              "invoiceFile",
              "frontImageFile",
              "sideImageFile",
              "engineImageFile",
              "controlPanelFile",
              "insuranceFile",
            ],
            job: [
              "jobType",
              "terrainType",
              "jobLocation",
              "jobLocationImageFile",
              "deliveryDate",
              "additionalDetails",
              "timePeriod",
              "status",
              "customerId",
              "equipmentId",
            ],
          };
          return modelFields[model] || [];
        };

        const fields = getFieldsForModel(model);

        return (
          <div className="bg-white rounded-xl shadow-lg">
            <div className="p-6 border-b border-gray-200 flex justify-between items-center">
              <div>
                <h2 className="text-2xl font-bold text-gray-900">
                  {record ? "Edit" : "Add New"}{" "}
                  {model.charAt(0).toUpperCase() + model.slice(1)}
                </h2>
                <p className="text-gray-600 mt-1">
                  {record
                    ? "Update the information below"
                    : "Fill in the details to create a new record"}
                </p>
              </div>
              <div className="flex space-x-3">
                <button
                  type="button"
                  onClick={onCancel}
                  className="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors"
                >
                  <i className="fas fa-times mr-2"></i>Cancel
                </button>
                <button
                  onClick={handleSubmit}
                  className="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
                >
                  <i
                    className={`fas ${record ? "fa-save" : "fa-plus"} mr-2`}
                  ></i>
                  {record ? "Update" : "Create"}
                </button>
              </div>
            </div>

            <div className="p-6">
              <form
                onSubmit={handleSubmit}
                className="grid grid-cols-1 md:grid-cols-2 gap-6"
              >
                {fields.map((field) => renderField(field))}
              </form>
            </div>
          </div>
        );
      };

      // Model list component
      const ModelList = ({
        model,
        viewMode,
        setViewMode,
        editingRecord,
        setEditingRecord,
      }) => {
        const [records, setRecords] = useState([]);
        const [loading, setLoading] = useState(true);
        const [currentPage, setCurrentPage] = useState(1);
        const [totalPages, setTotalPages] = useState(1);
        const [search, setSearch] = useState("");

        const fetchRecords = async (page = 1, searchTerm = "") => {
          setLoading(true);
          try {
            const data = await api.get(
              `/${model}?page=${page}&limit=10&search=${searchTerm}`
            );
            setRecords(data.records);
            setTotalPages(data.pagination.pages);
          } catch (error) {
            console.error("Error fetching records:", error);
          } finally {
            setLoading(false);
          }
        };

        useEffect(() => {
          if (viewMode === "list") {
            fetchRecords(currentPage, search);
          }
        }, [model, currentPage, search, viewMode]);

        const handleSearch = (e) => {
          const value = e.target.value;
          setSearch(value);
          setCurrentPage(1);
        };

        const handleSave = async (data) => {
          try {
            if (editingRecord) {
              await api.put(`/${model}/${editingRecord.id}`, data);
            } else {
              await api.post(`/${model}`, data);
            }
            setViewMode("list");
            setEditingRecord(null);
            fetchRecords(currentPage, search);
          } catch (error) {
            alert("Error saving record: " + error.message);
          }
        };

        const handleDelete = async (id) => {
          if (!confirm("Are you sure you want to delete this record?")) return;

          try {
            await api.delete(`/${model}/${id}`);
            fetchRecords(currentPage, search);
          } catch (error) {
            alert("Error deleting record: " + error.message);
          }
        };

        const getDisplayFields = (record) => {
          const displayMap = {
            customer: ["fullName", "email", "phone"],
            vendor: ["companyName", "email", "coordinatorName"],
            equipment: ["machineName", "machineType", "status", "dailyPrice"],
            job: ["jobType", "status", "deliveryDate"],
          };

          const fields = displayMap[model] || Object.keys(record).slice(0, 3);
          return fields.map((field) => ({ field, value: record[field] }));
        };

        const renderDetailView = (record) => {
          const allFields = Object.keys(record);
          const fileFields = allFields
            .filter(
              (field) => field.includes("File") || field.includes("Image")
            )
            .filter((field) => record[field]);

          return (
            <div className="bg-white rounded-xl shadow-lg">
              <div className="p-6 border-b border-gray-200 flex justify-between items-center">
                <div>
                  <h2 className="text-2xl font-bold text-gray-900 capitalize">
                    {model} Details
                  </h2>
                  <p className="text-gray-600 mt-1">
                    Complete information and associated files
                  </p>
                </div>
                <div className="flex space-x-3">
                  <button
                    onClick={() => setViewMode("list")}
                    className="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors"
                  >
                    <i className="fas fa-arrow-left mr-2"></i>Back to List
                  </button>
                  <button
                    onClick={() => {
                      setEditingRecord(record);
                      setViewMode("form");
                    }}
                    className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
                  >
                    <i className="fas fa-edit mr-2"></i>Edit
                  </button>
                </div>
              </div>

              <div className="p-6">
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                  <div>
                    <h3 className="text-lg font-semibold mb-4 text-gray-900">
                      Basic Information
                    </h3>
                    <div className="space-y-4">
                      {allFields
                        .filter(
                          (field) =>
                            !field.includes("File") &&
                            !field.includes("Image") &&
                            ![
                              "id",
                              "createdAt",
                              "updatedAt",
                              "password",
                            ].includes(field)
                        )
                        .map((field) => (
                          <div
                            key={field}
                            className="flex justify-between items-start py-2 border-b border-gray-100"
                          >
                            <span className="text-sm font-medium text-gray-600 capitalize">
                              {field.replace(/([A-Z])/g, " $1").trim()}:
                            </span>
                            <span className="text-sm text-gray-900 text-right max-w-xs">
                              {field.includes("Date") && record[field]
                                ? new Date(record[field]).toLocaleDateString()
                                : field === "rating" && record[field]
                                ? `${record[field]}/5 ⭐`
                                : typeof record[field] === "boolean"
                                ? record[field]
                                  ? "✅ Yes"
                                  : "❌ No"
                                : String(record[field] || "Not specified")}
                            </span>
                          </div>
                        ))}
                    </div>
                  </div>

                  {fileFields.length > 0 && (
                    <div>
                      <h3 className="text-lg font-semibold mb-4 text-gray-900">
                        Files & Documents
                      </h3>
                      <div className="space-y-3">
                        {fileFields.map((field) => (
                          <div
                            key={field}
                            className="p-4 bg-gray-50 rounded-lg"
                          >
                            <div className="flex items-center justify-between">
                              <div className="flex items-center">
                                <i
                                  className={`fas ${
                                    record[field].includes(".pdf")
                                      ? "fa-file-pdf text-red-500"
                                      : record[field].match(
                                          /\.(jpg|jpeg|png|gif)$/i
                                        )
                                      ? "fa-image text-blue-500"
                                      : "fa-file text-gray-500"
                                  } text-xl mr-3`}
                                ></i>
                                <div>
                                  <p className="font-medium text-gray-900 capitalize">
                                    {field
                                      .replace(/([A-Z])/g, " $1")
                                      .replace("File", "")
                                      .trim()}
                                  </p>
                                  <p className="text-sm text-gray-600">
                                    {record[field].split("/").pop()}
                                  </p>
                                </div>
                              </div>
                              <a
                                href={record[field]}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm"
                              >
                                <i className="fas fa-external-link-alt mr-1"></i>
                                View
                              </a>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {model === "job" && record.applications && (
                    <div className="lg:col-span-2">
                      <h3 className="text-lg font-semibold mb-4 text-gray-900">
                        Job Applications
                      </h3>
                      {record.applications.length === 0 ? (
                        <div className="text-center py-8 bg-gray-50 rounded-lg">
                          <i className="fas fa-inbox text-gray-400 text-3xl mb-3"></i>
                          <p className="text-gray-600">
                            No applications received yet
                          </p>
                        </div>
                      ) : (
                        <div className="space-y-3">
                          {record.applications.map((app) => (
                            <div
                              key={app.id}
                              className="p-4 border border-gray-200 rounded-lg"
                            >
                              <div className="flex justify-between items-center">
                                <div>
                                  <p className="font-medium">
                                    {app.vendor?.companyName}
                                  </p>
                                  <p className="text-sm text-gray-600">
                                    Price: ₹{app.vendorPrice?.toLocaleString()}
                                  </p>
                                </div>
                                <span
                                  className={`px-3 py-1 rounded-full text-xs font-medium ${
                                    app.status === "SELECTED"
                                      ? "bg-green-100 text-green-800"
                                      : app.status === "PENDING"
                                      ? "bg-yellow-100 text-yellow-800"
                                      : "bg-gray-100 text-gray-800"
                                  }`}
                                >
                                  {app.status}
                                </span>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        };

        if (viewMode === "form") {
          return (
            <ModelForm
              model={model}
              record={editingRecord}
              onSave={handleSave}
              onCancel={() => {
                setViewMode("list");
                setEditingRecord(null);
              }}
            />
          );
        }

        if (viewMode === "detail" && editingRecord) {
          return renderDetailView(editingRecord);
        }

        return (
          <div className="p-6">
            <div className="flex justify-between items-center mb-6">
              <div>
                <h1 className="text-3xl font-bold text-gray-900 capitalize">
                  {model}s
                </h1>
                <p className="text-gray-600 mt-1">
                  Manage your {model} records
                </p>
              </div>
              <button
                onClick={() => {
                  setEditingRecord(null);
                  setViewMode("form");
                }}
                className="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors shadow-lg"
              >
                <i className="fas fa-plus mr-2"></i>Add New{" "}
                {model.charAt(0).toUpperCase() + model.slice(1)}
              </button>
            </div>

            <div className="mb-6">
              <div className="relative">
                <input
                  type="text"
                  placeholder={`Search ${model}s...`}
                  value={search}
                  onChange={handleSearch}
                  className="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                />
                <i className="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
              </div>
            </div>

            {loading ? (
              <div className="flex justify-center items-center h-64">
                <div className="text-center">
                  <i className="fas fa-spinner fa-spin text-3xl text-blue-500 mb-4"></i>
                  <p className="text-gray-600">Loading {model}s...</p>
                </div>
              </div>
            ) : (
              <>
                <div className="bg-white rounded-xl shadow-lg overflow-hidden">
                  <div className="overflow-x-auto">
                    <table className="w-full">
                      <thead className="bg-gray-50">
                        <tr>
                          {records[0] &&
                            getDisplayFields(records[0]).map(({ field }) => (
                              <th
                                key={field}
                                className="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider"
                              >
                                {field.replace(/([A-Z])/g, " $1").trim()}
                              </th>
                            ))}
                          <th className="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                            Status
                          </th>
                          <th className="px-6 py-4 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">
                            Actions
                          </th>
                        </tr>
                      </thead>
                      <tbody className="bg-white divide-y divide-gray-200">
                        {records.map((record) => (
                          <tr
                            key={record.id}
                            className="hover:bg-gray-50 transition-colors"
                          >
                            {getDisplayFields(record).map(
                              ({ field, value }) => (
                                <td
                                  key={field}
                                  className="px-6 py-4 whitespace-nowrap text-sm text-gray-900"
                                >
                                  {field.includes("Date") && value
                                    ? new Date(value).toLocaleDateString()
                                    : field === "rating" && value
                                    ? `${value}/5 ⭐`
                                    : field.includes("Price") && value
                                    ? `₹${value.toLocaleString()}`
                                    : typeof value === "boolean"
                                    ? value
                                      ? "✅"
                                      : "❌"
                                    : String(value || "").length > 30
                                    ? String(value).substring(0, 30) + "..."
                                    : String(value || "")}
                                </td>
                              )
                            )}
                            <td className="px-6 py-4 whitespace-nowrap">
                              <span
                                className={`px-3 py-1 rounded-full text-xs font-medium ${
                                  record.status === "ACTIVE" ||
                                  record.status === "APPROVED"
                                    ? "bg-green-100 text-green-800"
                                    : record.status === "PENDING" ||
                                      record.status === "IN_PROGRESS"
                                    ? "bg-yellow-100 text-yellow-800"
                                    : record.status === "INACTIVE" ||
                                      record.status === "CANCELLED"
                                    ? "bg-red-100 text-red-800"
                                    : "bg-gray-100 text-gray-800"
                                }`}
                              >
                                {record.status || "N/A"}
                              </span>
                            </td>
                            <td className="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                              <div className="flex items-center justify-end space-x-2">
                                <button
                                  onClick={() => {
                                    setEditingRecord(record);
                                    setViewMode("detail");
                                  }}
                                  className="text-blue-600 hover:text-blue-800 p-2 hover:bg-blue-50 rounded-lg transition-colors"
                                  title="View Details"
                                >
                                  <i className="fas fa-eye"></i>
                                </button>
                                <button
                                  onClick={() => {
                                    setEditingRecord(record);
                                    setViewMode("form");
                                  }}
                                  className="text-green-600 hover:text-green-800 p-2 hover:bg-green-50 rounded-lg transition-colors"
                                  title="Edit"
                                >
                                  <i className="fas fa-edit"></i>
                                </button>
                                <button
                                  onClick={() => handleDelete(record.id)}
                                  className="text-red-600 hover:text-red-800 p-2 hover:bg-red-50 rounded-lg transition-colors"
                                  title="Delete"
                                >
                                  <i className="fas fa-trash"></i>
                                </button>
                              </div>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                  {records.length === 0 && (
                    <div className="p-12 text-center">
                      <i className="fas fa-inbox text-gray-400 text-4xl mb-4"></i>
                      <h3 className="text-lg font-medium text-gray-900 mb-2">
                        No {model}s found
                      </h3>
                      <p className="text-gray-600">
                        Get started by adding your first {model}
                      </p>
                    </div>
                  )}
                </div>

                {totalPages > 1 && (
                  <div className="flex justify-between items-center mt-6 px-4 py-3 bg-white rounded-lg shadow">
                    <div className="text-sm text-gray-700">
                      Page {currentPage} of {totalPages}
                    </div>
                    <div className="flex space-x-2">
                      <button
                        onClick={() =>
                          setCurrentPage((prev) => Math.max(prev - 1, 1))
                        }
                        disabled={currentPage === 1}
                        className="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-50 transition-colors"
                      >
                        <i className="fas fa-chevron-left mr-2"></i>Previous
                      </button>
                      <button
                        onClick={() =>
                          setCurrentPage((prev) =>
                            Math.min(prev + 1, totalPages)
                          )
                        }
                        disabled={currentPage === totalPages}
                        className="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-50 transition-colors"
                      >
                        Next<i className="fas fa-chevron-right ml-2"></i>
                      </button>
                    </div>
                  </div>
                )}
              </>
            )}
          </div>
        );
      };

      // Main App component
      const App = () => {
        const [activeTab, setActiveTab] = useState("dashboard");
        const [viewMode, setViewMode] = useState("list"); // list, detail, form
        const [editingRecord, setEditingRecord] = useState(null);

        // Reset view mode when changing tabs
        const handleTabChange = (tabId) => {
          setActiveTab(tabId);
          setViewMode("list");
          setEditingRecord(null);
        };

        const tabs = [
          { id: "dashboard", name: "Dashboard", icon: "fas fa-chart-pie" },
          { id: "customer", name: "Customers", icon: "fas fa-users" },
          { id: "vendor", name: "Vendors", icon: "fas fa-store" },
          { id: "equipment", name: "Equipment", icon: "fas fa-cogs" },
          { id: "job", name: "Jobs", icon: "fas fa-briefcase" },
        ];

        return (
          <div className="min-h-screen bg-gray-50">
            {/* Header */}
            <header className="bg-white shadow-sm border-b sticky top-0 z-40">
              <div className="px-6 py-4">
                <div className="flex items-center justify-between">
                  <div className="flex items-center">
                    <div className="p-2 bg-blue-600 rounded-lg mr-3">
                      <i className="fas fa-tools text-white text-xl"></i>
                    </div>
                    <div>
                      <h1 className="text-2xl font-bold text-gray-900">
                        Admin Portal
                      </h1>
                      <p className="text-sm text-gray-600">
                        Equipment Rental Management
                      </p>
                    </div>
                  </div>
                  <div className="flex items-center space-x-4">
                    <div className="text-right">
                      <p className="text-sm font-medium text-gray-900">
                        Administrator
                      </p>
                      <p className="text-xs text-gray-600">admin@example.com</p>
                    </div>
                    <div className="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center">
                      <i className="fas fa-user text-white text-sm"></i>
                    </div>
                  </div>
                </div>
              </div>
            </header>

            <div className="flex">
              {/* Sidebar */}
              <nav className="w-64 bg-white shadow-sm min-h-screen sticky top-16">
                <div className="p-4">
                  <ul className="space-y-1">
                    {tabs.map((tab) => (
                      <li key={tab.id}>
                        <button
                          onClick={() => handleTabChange(tab.id)}
                          className={`w-full flex items-center px-4 py-3 text-left rounded-xl transition-all duration-200 ${
                            activeTab === tab.id
                              ? "bg-blue-600 text-white shadow-lg transform scale-105"
                              : "text-gray-700 hover:bg-gray-100 hover:shadow-md"
                          }`}
                        >
                          <i className={`${tab.icon} mr-3 w-5 text-center`}></i>
                          <span className="font-medium">{tab.name}</span>
                        </button>
                      </li>
                    ))}
                  </ul>
                </div>
              </nav>

              {/* Main Content */}
              <main className="flex-1 min-h-screen">
                {activeTab === "dashboard" ? (
                  <Dashboard />
                ) : (
                  <ModelList
                    model={activeTab}
                    viewMode={viewMode}
                    setViewMode={setViewMode}
                    editingRecord={editingRecord}
                    setEditingRecord={setEditingRecord}
                  />
                )}
              </main>
            </div>
          </div>
        );
      };

      // Error boundary
      class ErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { hasError: false, error: null };
        }

        static getDerivedStateFromError(error) {
          return { hasError: true, error };
        }

        componentDidCatch(error, errorInfo) {
          console.error("Admin Portal Error:", error, errorInfo);
        }

        render() {
          if (this.state.hasError) {
            return (
              <div className="min-h-screen bg-gray-100 flex items-center justify-center">
                <div className="bg-white p-8 rounded-xl shadow-lg text-center max-w-md">
                  <i className="fas fa-exclamation-triangle text-red-500 text-5xl mb-4"></i>
                  <h2 className="text-2xl font-bold text-gray-900 mb-4">
                    Something went wrong
                  </h2>
                  <p className="text-gray-600 mb-6">
                    The application encountered an unexpected error. Please
                    refresh the page and try again.
                  </p>
                  <button
                    onClick={() => window.location.reload()}
                    className="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors"
                  >
                    <i className="fas fa-refresh mr-2"></i>Refresh Page
                  </button>
                </div>
              </div>
            );
          }

          return this.props.children;
        }
      }

      // Render the app with error boundary
      ReactDOM.render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>,
        document.getElementById("root")
      );
    </script>
  </body>
</html>
